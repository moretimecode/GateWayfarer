receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_http:
        endpoint: 0.0.0.0:14268

  prometheus:
    config:
      scrape_configs:
        - job_name: "api-gateway"
          static_configs:
            - targets: ["localhost:9090"]

processors:
  batch:
    send_batch_size: 1000
    timeout: 10s

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  attributes:
    actions:
      - key: service.name
        value: api-gateway
        action: insert
      - key: environment
        value: development
        action: insert

  span:
    name:
      to_attributes:
        rules:
          - ^/api/.*
          - ^/health.*

exporters:
  clickhouse:
    dsn: tcp://clickhouse:9000/signoz
    database: signoz
    trace_table: signoz_traces
    metrics_table: signoz_metrics
    logs_table: signoz_logs
    create_schema: true
    drop_database_on_start: false

  kafka:
    brokers:
      - kafka:29092
    default_topic: "spans"
    marshaler: "otlp_json"

extensions:
  health_check:
    endpoint: :13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp, jaeger]
      processors: [memory_limiter, batch, attributes]
      exporters: [clickhouse, kafka]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
